name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk unzip zip autoconf libtool pkg-config ccache libncurses5-dev libncursesw5-dev libssl-dev libffi-dev libsqlite3-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer kivy requests

    - name: Auto Accept Android Licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "89330d171ced9910b7023b28b173f18715bc3480\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24731062070000ba2ee6ed176974c5d8a9284242" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AH-Irfan-Weather-APK
        path: bin/*.apk
